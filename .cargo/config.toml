[alias]
xtask = "run --package xtask --"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tkernel/linker.ld",
    "-C", "link-arg=-zmax-page-size=0x1000",
    "-C", "link-arg=-znoexecstack",
    "-C", "link-arg=-static",
    "-C", "link-arg=--no-pie",
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
]
